services:
  aic-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aic-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
     
      - ./app.db:/app/app.db
      # Mount ML models (read-only)
      - ./src/models:/app/src/models:ro
    networks:
      - elysia-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aic-backend.rule=Host(`aic.elysiavernight.com`)"
      - "traefik.http.routers.aic-backend.entrypoints=websecure"
      - "traefik.http.routers.aic-backend.tls=true"
      - "traefik.http.routers.aic-backend.tls.certresolver=myresolver"
      - "traefik.http.services.aic-backend.loadbalancer.server.port=7700"

networks:
  elysia-network:
    external: true